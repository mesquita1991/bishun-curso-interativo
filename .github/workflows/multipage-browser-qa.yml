name: Bǐshùn 6.9 browser QA
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Verify progressive pages in Chromium
        run: node tests/multipage-browser-smoke.mjs
