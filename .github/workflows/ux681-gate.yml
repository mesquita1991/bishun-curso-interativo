name: Bǐshùn — integridade e navegação da página única
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: bishun-single-page-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar todo o currículo e estrutura
        run: npm run check
      - name: Instalar navegador de teste
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Testar percurso, progresso, biblioteca e telas reais
        run: node tests/app-browser-smoke.mjs
