name: Bǐshùn — página única
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: bishun-single-page-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar conteúdo preservado e página única
        run: npm run check
