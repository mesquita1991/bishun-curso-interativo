name: Bǐshùn — validação consolidada
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# Uma execução por PR/branch; novas versões substituem testes obsoletos.
# Falha de código NÃO provoca nova tentativa automática nem publicação.
concurrency:
  group: bishun-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  fast:
    name: Pré-verificação do código
    outputs:
      proceed: ${{ steps.rate.outputs.proceed }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Limite de frequência — até 3 por minuto
        id: rate
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'ux681-gate.yml', per_page: 50
            });
            const recent = data.workflow_runs.filter(run =>
              ['pull_request','push','workflow_dispatch'].includes(run.event) &&
              Date.parse(run.created_at) >= Date.now() - 60000
            ).length;
            const allowed = recent <= 3;
            core.setOutput('proceed', String(allowed));
            if (!allowed) core.notice('Mais de 3 gatilhos/minuto: testes custosos omitidos. Um novo check aprovado é obrigatório antes da publicação.');
      - uses: actions/checkout@v4
        if: steps.rate.outputs.proceed == 'true'
      - uses: actions/setup-node@v4
        if: steps.rate.outputs.proceed == 'true'
        with:
          node-version: '22'
      - name: Verificação funcional, sintática e curricular
        if: steps.rate.outputs.proceed == 'true'
        run: |
          npm run check
          node tests/manual-integrity-check.mjs
      - name: Impedir modificações não autorizadas no currículo
        if: github.event_name == 'pull_request' && steps.rate.outputs.proceed == 'true'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --exit-code "origin/${{ github.base_ref }}" HEAD -- data/

  browser:
    name: Navegação real após aprovação do código
    needs: fast
    if: needs.fast.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar testes de navegador
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Testar navegação multipágina e percurso do aluno
        run: |
          node tests/multipage-browser-smoke.mjs
          node tests/unit-study-browser-smoke.mjs
          node tests/site-design-browser-smoke.mjs
          node tests/manual-browser-smoke.mjs
          node tests/trilha-v9-browser-smoke.mjs
