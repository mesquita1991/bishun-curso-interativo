name: Bǐshùn — validação da auto-aula
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: bishun-single-page-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar a aula ativa e a preservação do legado
        run: npm run check
      - name: Montar publicação sem os arquivos legados
        run: npm run build
      - name: Instalar navegador de teste
        run: |
          npm install --no-save playwright axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Testar os exercícios, progresso, rubricagem e telas reais
        run: |
          node tests/autoaula-browser-smoke.mjs
          node tests/curso90-browser-smoke.mjs
